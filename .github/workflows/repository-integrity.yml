name: Repository integrity
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  material-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      README_ENTRY: 'README.md'
      MIN_EXPECTED_PYTHON_SOURCES: '20'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validate supplied materials and source/configuration syntax
        run: python .github/scripts/check_repository.py
      - name: Check portable finite checker preparation regression
        run: python -W error -m unittest discover -s tests -p test_prepared_checker.py -v

  scientific-campaign:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        seed: ['1729', '2718']
        timezone: ['UTC', 'America/Los_Angeles']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONHASHSEED: ${{ matrix.seed }}
      TZ: ${{ matrix.timezone }}
      LC_ALL: C.UTF-8
      LANG: C.UTF-8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Install the isolated selected test dependencies
        run: python -m pip install --only-binary=:all: -r requirements-test.txt
      - name: Check release and reproduce every scientific family
        env:
          EVIDENCE: ${{ runner.temp }}/authrefine-evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          timeout --kill-after=10s 180s python verify_release.py --json 2>&1 | tee "$EVIDENCE/release.log"
          timeout --kill-after=10s 300s python reproduce.py --output "$EVIDENCE/campaign" --compare results 2>&1 | tee "$EVIDENCE/campaign.log"
          python - <<'PY' 2>&1 | tee "$EVIDENCE/output-contract.log"
          import json, os
          from pathlib import Path
          import verify_release
          report = verify_release.inspect_campaign_output(
              Path(os.environ['EVIDENCE']) / 'campaign',
              expected_seed=os.environ['PYTHONHASHSEED'],
              expected_timezone=os.environ['TZ'],
          )
          print(json.dumps(report, indent=2))
          PY
      - name: Recompute the same-information comparison into fresh evidence
        env:
          EVIDENCE: ${{ runner.temp }}/authrefine-evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE"
          timeout --kill-after=10s 180s python -W error src/baseline_checks.py --output "$EVIDENCE/same-information.json" --repeats 7 2>&1 | tee "$EVIDENCE/same-information.log"
          python - <<'PY' 2>&1 | tee "$EVIDENCE/same-information-contract.log"
          import json, os
          from pathlib import Path
          report = json.loads((Path(os.environ['EVIDENCE']) / 'same-information.json').read_text())
          records = report['records']
          methods = ('region_with_production', 'ordinary_bfs', 'reachable_compact', 'reachable_detailed')
          checks = {
              'completed_comparison': report.get('status') == 'pass',
              'ordered_primary_records': [row['case'] for row in records] == [f'case-{i:05d}' for i in range(10000)],
              'main_workflow_cases': report['totals']['completed_cases'] == 9985,
              'executed_product_cases': report['totals']['product_cases'] == 9977,
              'retained_negative_branch': report['negative_evidence_records_retained'] == 15,
              'all_retained_examples': len(report['examples']) == 49,
              'all_declared_widths': [row['aliases'] for row in report['width']] == list(range(1, 17)),
              'seven_samples_each': all(len(report['timing_49_examples'][method]['seconds']) == 7 for method in methods),
              'public_projection_agreement': report['public']['all_agree'] is True,
          }
          print(json.dumps(checks, indent=2))
          if not all(checks.values()):
              raise ValueError('incomplete same-information comparison output')
          PY
      - name: Preserve raw logs and complete or partial scientific output
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: authrefine-seed-${{ matrix.seed }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/authrefine-evidence
          if-no-files-found: warn
          retention-days: 14
