name: Source-bound normal-context study
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-study:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Check the shipped source study and unknown propagation
        run: python -B -m unittest discover -s tests -p test_source_study.py -v
      - name: Install the namespace utility and load its distro AppArmor profile
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
          sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
      - name: Prepare frozen pure framework wheels
        run: /usr/bin/python3 -B source_study/replay.py prepare --framework "${{ runner.temp }}/authrefine-framework"
      - name: Replay the complete owned credential chain without network or host home
        run: timeout 180s /usr/bin/python3 -B source_study/replay.py replay --framework "${{ runner.temp }}/authrefine-framework"
