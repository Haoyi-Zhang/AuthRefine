name: Source adaptation case study
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  source-survey:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.14'
      - run: python -B adaptation_study/study.py --check
      - run: python -B adaptation_study/study.py --check-casebook
  source-bound-adaptations:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --only-binary=:all: -r requirements-test.txt
      - run: python -B source_study/replay.py prepare --framework "${{ runner.temp }}/authrefine-framework"
      - name: Recompute current adapters and detect owned missing-save and missing-active-check controls
        run: |
          export PYTHONPATH="${{ runner.temp }}/authrefine-framework"
          python -B adaptation_study/profiles.py --check
          python -B adaptation_study/profiles.py --control drop_save
          python -B adaptation_study/profiles.py --control skip_active
          python -B -W error -m unittest discover -s tests -p test_adaptation_study.py -v
          python -B adaptation_study/chained_profiles.py health --check
          python -B adaptation_study/chained_profiles.py health --control lost_save
          python -B adaptation_study/chained_profiles.py health --control repeat_write
      - name: Prepare source-declared native header primitives separately
        run: python -B adaptation_study/chained_profiles.py prepare --framework "${{ runner.temp }}/authrefine-header-framework"
      - name: Recompute connected native header and source permission results
        run: |
          python -B adaptation_study/chained_profiles.py header --framework "${{ runner.temp }}/authrefine-header-framework" --check
          python -B adaptation_study/chained_profiles.py header --framework "${{ runner.temp }}/authrefine-header-framework" --control header_bypass
          python -B adaptation_study/chained_profiles.py header --framework "${{ runner.temp }}/authrefine-header-framework" --control skip_active
          python -B -W error -m unittest discover -s tests -p test_chained_profiles.py -v
          python -B -W error -m unittest discover -s tests -p test_view_binding.py -v
      - name: Recompute source-derived default-core grants and detect boundary faults
        run: |
          python -B adaptation_study/grant_binding.py --framework "${{ runner.temp }}/authrefine-header-framework" --check
          python -B adaptation_study/grant_binding.py --framework "${{ runner.temp }}/authrefine-header-framework" --control drop_all
          python -B adaptation_study/grant_binding.py --framework "${{ runner.temp }}/authrefine-header-framework" --control raw_keys
          python -B adaptation_study/grant_binding.py --framework "${{ runner.temp }}/authrefine-header-framework" --control drop_legacy
          python -B -W error -m unittest discover -s tests -p test_grant_binding.py -v
